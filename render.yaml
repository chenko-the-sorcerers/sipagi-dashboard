services:
  - type: web
    name: sipagi-dashboard
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SIPAGI_DATA_SOURCE
        value: api
      - key: GAS_BRIDGE_ENABLED
        value: true
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GAS_ENDPOINT
        sync: false
      - key: SIPAGI_DEMO_PASSWORD
        sync: false
      - key: SIPAGI_API_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
